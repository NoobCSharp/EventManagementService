# PostgreSQL для EventApi — совпадает с ConnectionStrings:DefaultConnection в appsettings.json
# Данные сохраняются в именованном томе eventapi_pgdata

# docker compose -f .\src\EventManagementService\docker-compose.yml up -d (команда поднятия сервера)
# docker compose -f .\src\EventManagementService\docker-compose.yml down (команда остановка сервера)
# docker compose -f .\src\EventManagementService\docker-compose.yml down -v (команда полной остановка и очистки сервера)

services:
  postgres:
    image: postgres:16
    container_name: eventapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventapi
    ports:
      - "5432:5432"
    volumes:
      - eventapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventapi_pgdata:
